name: Desktop Windows

# A version tag is a release. Pushing v0.1.0 builds the Windows NSIS
# installer and attaches it to that GitHub release. Other platforms later.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop UI dependencies
        working-directory: apps/desktop/ui
        run: bun install --frozen-lockfile

      - name: The tag must name the app version
        shell: pwsh
        run: |
          $conf = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$conf") { throw "tag $tag does not match tauri.conf.json version $conf" }

      - name: Compile the service sidecar
        shell: pwsh
        run: |
          $triple = (rustc --print host-tuple).Trim()
          if (-not $triple) { throw "rustc did not print a host tuple" }
          $dir = "apps/desktop/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          bun build --compile --windows-hide-console ./packages/service/src/index.ts --outfile "$dir/strata-service-$triple.exe"
          Get-Item "$dir/strata-service-$triple.exe" | Format-List FullName, Length

      - name: Build the Windows installer and publish the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          tauriScript: bunx --bun @tauri-apps/cli@2
          args: --bundles nsis
          releaseName: Agent Strata v__VERSION__
          releaseBody: Windows installer for Agent Strata v__VERSION__.
          uploadUpdaterJson: false
