name: Desktop Release

# A version tag is a release. Pushing v0.1.0 builds the installers for
# Windows (NSIS) and macOS (dmg) and attaches them to that tag's GitHub
# release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The original check only. Rust still runs on main, but a failure there
  # must not skip the installers — that is what held 0.21.0.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      only_check: true

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: Windows installer
          - os: macos-latest
            bundles: dmg
            artifact: macOS bundle
    runs-on: ${{ matrix.os }}
    # A tag suffixed `-branded` builds under the `branded` environment, whose
    # variables carry a custom brand; anything else runs under `release`, an
    # empty environment where repository variables still flow through.
    environment:
      name: ${{ endsWith(github.ref_name, '-branded') && 'branded' || 'release' }}
    # A fork renames its build by setting repository variables. GitHub does not
    # export `vars.*` on its own, so each one is mapped here by hand; upstream
    # sets none and every expression resolves to an empty string, which
    # `scripts/brand.ts` reads as "no brand" and leaves the defaults alone.
    #
    # Job-level rather than per-step, and that is the whole point: the overlay
    # is written in one step while the page is built in another (Tauri runs
    # `beforeBuildCommand` later), and both have to resolve the same brand. A
    # step-scoped variable would reach only the first, and the installer would
    # carry one name while the window it opens carried another.
    env:
      STRATA_BRAND: ${{ vars.STRATA_BRAND }}
      STRATA_BRAND_NAME: ${{ vars.STRATA_BRAND_NAME }}
      STRATA_BRAND_IDENTIFIER: ${{ vars.STRATA_BRAND_IDENTIFIER }}
      STRATA_BRAND_DATA_DIR: ${{ vars.STRATA_BRAND_DATA_DIR }}
      STRATA_BRAND_SOURCE_URL: ${{ vars.STRATA_BRAND_SOURCE_URL }}
      STRATA_BRAND_SOURCE_LABEL: ${{ vars.STRATA_BRAND_SOURCE_LABEL }}
      STRATA_BRAND_SOURCE_TITLE: ${{ vars.STRATA_BRAND_SOURCE_TITLE }}
      STRATA_BRAND_SOURCE_HINT: ${{ vars.STRATA_BRAND_SOURCE_HINT }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop UI dependencies
        working-directory: apps/desktop/ui
        run: bun install --frozen-lockfile

      - name: The tag must name the app version
        shell: pwsh
        run: |
          $conf = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$conf" -and $tag -ne "v$conf-branded") { throw "tag $tag does not match tauri.conf.json version $conf (expected v$conf or v$conf-branded)" }

      # The brand is resolved here, once: `scripts/brand.ts` writes the Tauri
      # overlay and the Rust constants, and Vite injects the same answer into
      # the page when Tauri later runs `beforeBuildCommand`. The environment
      # comes from the job-level `env` above.
      #
      # The name is read back for the release title: the workflow cannot know it
      # otherwise, and a white-label build whose release page still said the
      # upstream name would be the one place the rename missed.
      - name: Resolve the brand
        id: brand
        shell: bash
        run: |
          bun run brand
          name=$(bun run brand --print | bun -e 'const b = JSON.parse(await Bun.stdin.text()); process.stdout.write(b.brand.productName)')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # A `-branded` tag promises a custom brand, and the environment is the
          # only place that brand can come from. GitHub creates a referenced
          # environment that does not exist yet and fills it with nothing, so
          # the failure this guards is silent: the build succeeds, publishes,
          # and carries the upstream name — the one thing the tag was for.
          # Verified by comparing against the upstream defaults the resolver
          # would otherwise fall back to.
          if [[ "$GITHUB_REF_NAME" == *-branded ]]; then
            custom=$(bun run brand --print | bun -e 'const b = JSON.parse(await Bun.stdin.text()); process.stdout.write(String(b.custom))')
            if [ "$custom" != "true" ]; then
              echo "::error::tag $GITHUB_REF_NAME asks for a branded build, but no brand resolved — set the STRATA_BRAND_* variables on the 'branded' environment"
              exit 1
            fi
          fi
          # `--config` merges this over tauri.conf.json. The file is absent for
          # an upstream build, and `--config` on a missing file is an error, so
          # the flag is only added when there is something to merge.
          #
          # `$GITHUB_WORKSPACE`, not a bare relative path: tauri-action runs the
          # CLI with `projectPath` as its cwd (apps/desktop/src-tauri), and the
          # CLI reads `--config` relative to that cwd. A repo-root path would
          # resolve to `.../src-tauri/apps/desktop/src-tauri/...` and the build
          # would fail on a missing file — so a white-label release produced
          # nothing at all.
          if [ -f apps/desktop/src-tauri/brand.overlay.json ]; then
            echo "config=--config $GITHUB_WORKSPACE/apps/desktop/src-tauri/brand.overlay.json" >> "$GITHUB_OUTPUT"
          else
            echo "config=" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile the service sidecar
        run: bun run sidecar:force

      - name: Build the installer and publish the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          tauriScript: bunx --bun tauri
          args: --bundles ${{ matrix.bundles }} ${{ steps.brand.outputs.config }}
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.brand.outputs.name }} v__VERSION__
          releaseBody: ${{ matrix.artifact }} for ${{ steps.brand.outputs.name }} v__VERSION__.
          uploadUpdaterJson: false
