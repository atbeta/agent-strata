name: Desktop Release

# A version tag is a release. Pushing v0.1.0 builds the installers for
# Windows (NSIS), macOS (dmg), and Linux (AppImage) and attaches them to
# that tag's GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: Windows installer
          - os: macos-latest
            bundles: dmg
            artifact: macOS bundle
          - os: ubuntu-latest
            bundles: appimage
            artifact: Linux AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop UI dependencies
        working-directory: apps/desktop/ui
        run: bun install --frozen-lockfile

      - name: The tag must name the app version
        shell: pwsh
        run: |
          $conf = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$conf") { throw "tag $tag does not match tauri.conf.json version $conf" }

      # The brand is resolved here, once: `scripts/brand.ts` writes the Tauri
      # overlay, the Rust constants, and (through Vite) the page's copy. A fork
      # sets STRATA_BRAND or the STRATA_BRAND_* variables as repository
      # variables; upstream sets nothing, and the step removes any stale files
      # a previous local build left behind.
      #
      # The name is read back for the release title: the workflow cannot know it
      # otherwise, and a white-label build whose release page still said the
      # upstream name would be the one place the rename missed.
      - name: Resolve the brand
        id: brand
        shell: bash
        run: |
          bun run brand
          name=$(bun run brand --print | bun -e 'const b = JSON.parse(await Bun.stdin.text()); process.stdout.write(b.brand.productName)')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # `--config` merges this over tauri.conf.json. The file is absent for
          # an upstream build, and `--config` on a missing file is an error, so
          # the flag is only added when there is something to merge.
          if [ -f apps/desktop/src-tauri/brand.overlay.json ]; then
            echo "config=--config apps/desktop/src-tauri/brand.overlay.json" >> "$GITHUB_OUTPUT"
          else
            echo "config=" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile the service sidecar
        run: bun run sidecar:force

      - name: Build the installer and publish the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          tauriScript: bunx --bun @tauri-apps/cli@2
          args: --bundles ${{ matrix.bundles }} ${{ steps.brand.outputs.config }}
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.brand.outputs.name }} v__VERSION__
          releaseBody: ${{ matrix.artifact }} for ${{ steps.brand.outputs.name }} v__VERSION__.
          uploadUpdaterJson: false
