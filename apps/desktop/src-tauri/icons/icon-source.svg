<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- icon-source.png is rendered from this file:
       rsvg-convert -w 1024 -h 1024 icon-source.svg -o icon-source.png
       then regenerate the bundled sizes from icon-source.png. -->
  <rect width="1024" height="1024" rx="225" fill="#0f0f12"/>
  <!-- fault-block mark: one slab sheared once; the gap is the fault,
       the blue band tight against it is the present. 24-grid, scaled
       33.333x onto an 800px square centered in the tile. -->
  <g transform="translate(112 112) scale(33.3333)">
    <polygon points="2.8,3 18.8,3 18.8,9 2.8,12" fill="#8B8B93"/>
    <polygon points="5.2,12.8 21.2,9.8 21.2,13.3 5.2,16.3" fill="#6189E5"/>
    <polygon points="5.2,16.3 21.2,13.3 21.2,21 5.2,21" fill="#8B8B93"/>
  </g>
</svg>
