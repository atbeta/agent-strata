<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Overlap — Slate Metal</title>
  <desc id="desc">Slate tile with brushed-metal frames and a glossy green overlap.</desc>
  <defs>
    <linearGradient id="bg" x1=".25" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#39414C"/>
      <stop offset="1" stop-color="#151920"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".11"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".30"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="accentShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".42" stop-color="#C2CBD5"/>
      <stop offset=".54" stop-color="#EEF2F6"/>
      <stop offset="1" stop-color="#8E99A6"/>
    </linearGradient>
    <linearGradient id="accent" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#8FEBC2"/>
      <stop offset="1" stop-color="#2E9E71"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="155%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#04070B" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#sheen)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="206.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g transform="translate(512 512) scale(1.12) translate(-512 -512)">
    <path fill="url(#metal)" fill-opacity=".5" fill-rule="evenodd" d="M424 280H744V600H424ZM488 344V536H680V344Z"/>
    <rect x="424" y="424" width="176" height="176" fill="url(#accent)"/>
    <rect x="424" y="424" width="176" height="176" fill="url(#accentShine)"/>
    <path fill="url(#metal)" fill-rule="evenodd" filter="url(#shadow)" d="M280 424H600V744H280ZM344 488V680H536V488Z"/>
  </g>
</svg>
