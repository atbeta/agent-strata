<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%APP_NAME%</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        // Page backgrounds, one per theme and scheme. They match --background
        // in theme.css and are checked by theme.test.ts; this runs before the
        // stylesheet so the window never flashes another theme's colour.
        var themes = {
          "default": { "dark": "#101012", "light": "#fcfcfd" },
          "catppuccin": { "dark": "#1e1e2e", "light": "#eff1f5" },
          "dracula": { "dark": "#282a36", "light": "#fffbeb" },
          "gruvbox": { "dark": "#282828", "light": "#fbf1c7" },
          "one": { "dark": "#282c34", "light": "#fafafa" },
          "solarized": { "dark": "#002b36", "light": "#fdf6e3" }
        };
        var theme = "default";
        var scheme = "dark";
        try {
          var storedTheme = localStorage.getItem("strata.palette");
          if (Object.prototype.hasOwnProperty.call(themes, storedTheme)) theme = storedTheme;
          // strata.theme is the old name for the scheme; keep it readable so
          // an upgrade does not throw away the reader's answer.
          scheme =
            localStorage.getItem("strata.scheme") ||
            localStorage.getItem("strata.theme") ||
            "dark";
        } catch (e) {}
        if (scheme !== "dark" && scheme !== "light" && scheme !== "system") scheme = "dark";
        var light =
          scheme === "light" ||
          (scheme === "system" && matchMedia("(prefers-color-scheme: light)").matches);
        var mode = light ? "light" : "dark";
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.scheme = mode;
        root.style.colorScheme = mode;
        root.style.backgroundColor = themes[theme][mode];
        try {
          var fonts = JSON.parse(localStorage.getItem("strata.fonts") || "null");
          if (!fonts) return;
          function family(v) {
            if (typeof v !== "string") return "";
            v = v.replace(/["'\\;{}<>]/g, "").trim();
            if (!v || v.length > 80 || !/^[\p{L}\p{N} ._-]+$/u.test(v)) return "";
            return v;
          }
          var sans = family(fonts.ui);
          var mono = family(fonts.code);
          var sansFallback = 'ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif';
          var monoFallback = 'ui-monospace, "SF Mono", "Cascadia Code", "Cascadia Mono", Consolas, "PingFang SC", "Microsoft YaHei", "Noto Sans Mono CJK SC", monospace';
          if (sans) root.style.setProperty("--font-sans", '"' + sans + '", ' + sansFallback);
          if (mono) root.style.setProperty("--font-mono", '"' + mono + '", ' + monoFallback);
          var sizes = { "12": "12px", "13": "13px", "14": "14px", "15": "15px", "16": "16px" };
          if (sizes[fonts.size]) {
            root.dataset.contentSize = fonts.size;
            root.style.setProperty("--content-size", sizes[fonts.size]);
          }
          var leads = { compact: "1.35", normal: "1.5", relaxed: "1.7" };
          if (leads[fonts.leading]) {
            root.dataset.codeLeading = fonts.leading;
            root.style.setProperty("--code-leading", leads[fonts.leading]);
          }
          if (fonts.ligatures === false) root.dataset.codeLigatures = "off";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
