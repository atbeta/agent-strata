<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Strata</title>
    <script>
      (function () {
        var stored = "dark";
        try {
          stored = localStorage.getItem("strata.theme") || "dark";
        } catch (e) {}
        var light =
          stored === "light" ||
          (stored === "system" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
        try {
          var fonts = JSON.parse(localStorage.getItem("strata.fonts") || "null");
          if (!fonts) return;
          function family(v) {
            if (typeof v !== "string") return "";
            v = v.replace(/["'\\;{}<>]/g, "").trim();
            if (!v || v.length > 80 || !/^[\p{L}\p{N} ._-]+$/u.test(v)) return "";
            return v;
          }
          var root = document.documentElement;
          var sans = family(fonts.ui);
          var mono = family(fonts.code);
          if (sans) root.style.setProperty("--font-sans", '"' + sans + '", ui-sans-serif, system-ui, sans-serif');
          if (mono) root.style.setProperty("--font-mono", '"' + mono + '", ui-monospace, "Cascadia Code", monospace');
          var sizes = { "12": "12px", "13": "13px", "14": "14px", "15": "15px", "16": "16px" };
          if (sizes[fonts.size]) {
            root.dataset.codeSize = fonts.size;
            root.style.setProperty("--code-size", sizes[fonts.size]);
          }
          var leads = { compact: "1.35", normal: "1.5", relaxed: "1.7" };
          if (leads[fonts.leading]) {
            root.dataset.codeLeading = fonts.leading;
            root.style.setProperty("--code-leading", leads[fonts.leading]);
          }
          if (fonts.ligatures === false) root.dataset.codeLigatures = "off";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
