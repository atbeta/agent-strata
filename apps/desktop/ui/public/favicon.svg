<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Overlap — Slate Soft Light</title>
  <desc id="desc">Slate tile with a soft top sheen; satin frames cast gentle shadows and the green overlap glows softly.</desc>
  <defs>
    <linearGradient id="bg" x1=".25" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#39414C"/>
      <stop offset="1" stop-color="#151920"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".30"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="accentShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFD7E0"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="accent" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#9DF1CB"/>
      <stop offset="1" stop-color="#3CB584"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6FD4A7" stop-opacity=".42"/>
      <stop offset="1" stop-color="#6FD4A7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="155%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04070B" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#sheen)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="206.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="480" cy="544" r="230" fill="url(#glow)"/>
  <path fill="url(#back)" fill-rule="evenodd" d="M424 280H744V600H424ZM488 344V536H680V344Z"/>
  <rect x="424" y="424" width="176" height="176" fill="url(#accent)"/>
  <rect x="424" y="424" width="176" height="176" fill="url(#accentShine)"/>
  <path fill="url(#front)" fill-rule="evenodd" filter="url(#shadow)" d="M280 424H600V744H280ZM344 488V680H536V488Z"/>
</svg>
