<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 64 896 896" width="896" height="896">
  <!-- Monochrome Interlock mark: same upright rounded-square silhouette and
       stepped negative seams, single white so the UI can tint it via CSS
       mask or use it directly. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="240" y="240" width="544" height="544" rx="112" fill="#FFFFFF"/>
      <path d="M160 396H424Q456 396 456 428V460Q456 492 488 492H864" fill="none" stroke="#000000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M160 560H536Q568 560 568 592V624Q568 656 600 656H864" fill="none" stroke="#000000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g transform="translate(512 512) scale(1.6470588235294117) translate(-512 -512)">
    <rect x="240" y="240" width="544" height="544" rx="112" fill="#FFFFFF" mask="url(#cut)"/>
  </g>
</svg>
